name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      # 配了签名 Secrets（与 release.yml 同一组）就用它签 debug/release 两个包：
      # 签名固定，之后的构建才能覆盖安装。没配就什么都不写，Gradle 自动回落
      # 每次运行随机生成的 debug 签名（现状）。密码只经 $GITHUB_ENV 传给后续步骤。
      - name: Decode signing keystore (optional)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # 停在 v5（Node 24）而不是 v6：v6 把缓存功能拆成了闭源的 gradle-actions-caching，
      # 升级即视为接受 Gradle 的 Terms of Use。要不要接受是个许可决定，不是顺手升个版本 ——
      # 三个 workflow 统一停在这里，要升一起升。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Miuix 0.9.5-beta03 的 AAR 元数据要求 Android 37.2。
      - name: Install Android SDK platform 37.2
        run: |
          SM="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-37.2"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: inkwell-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 瘦身版：release 变体开 R8 + 资源压缩，体积与官方包同量级。
      # 签名同上：配了 Secrets 用固定签名，没配回落 debug 签名。
      - name: Build release APK (minified)
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: inkwell-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
